<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Alsama Tours</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7f8; color: #1f2a30; font-family: Arial, sans-serif; }
      main { width: min(620px, calc(100% - 40px)); border: 1px solid #e2e8ec; border-radius: 8px; background: #fff; padding: 28px; box-shadow: 0 14px 34px rgba(31, 42, 48, .08); }
      h1 { margin: 0 0 8px; font-size: 34px; line-height: 1.05; }
      p { margin: 0; color: #5f6f79; line-height: 1.6; }
    </style>
    <script>
      (function () {
        var base = "/Alsama";
        var path = window.location.pathname.replace(base, "") || "/";
        var hash = window.location.hash ? window.location.hash.slice(1) : "";
        var query = new URLSearchParams();
        query.set("p", path);
        if (hash) query.set("h", hash);
        window.location.replace(base + "/?" + query.toString());
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>Alsama Tours is opening the travel planner so you can choose another route.</p>
    </main>
  </body>
</html>
