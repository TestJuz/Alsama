    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirectPath = params.get("p");
        var redirectHash = params.get("h");
        if (!redirectPath) return;

        var base = "%BASE_URL%".replace(/\/$/, "");
        var normalizedPath = ("/" + redirectPath)
          .replace(/\\+/g, "/")
          .replace(/\/index\\.html$/i, "")
          .replace(/\/{2,}/g, "/");
        var nextHash = redirectHash ? "#" + redirectHash : window.location.hash;
        window.history.replaceState(null, "", base + normalizedPath + nextHash);
      })();
    </script>
